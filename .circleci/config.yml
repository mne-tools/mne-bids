# See: https://circleci.com/blog/deploying-documentation-to-github-pages-with-continuous-integration/
version: 2.1

_check_skip: &check_skip
  name: Check-skip
  command: |
    set -e
    export COMMIT_MESSAGE=$(git log --format=oneline -n 1);
    if [[ -v CIRCLE_PULL_REQUEST ]] && ([[ "$COMMIT_MESSAGE" == *"[skip circle]"* ]] || [[ "$COMMIT_MESSAGE" == *"[circle skip]"* ]]); then
      echo "Skip detected, exiting job ${CIRCLE_JOB} for PR ${CIRCLE_PULL_REQUEST}."
      circleci-agent step halt;
    fi

# gen3 resource classes are Linux VM only and are valid only with the `current`
# image tag; medium.gen3 has 2 vCPUs and 8 GiB at 7 credits/min
executors:
  linux:
    machine:
      image: ubuntu-2604:current
    resource_class: medium.gen3

jobs:
  docs-build:
    executor: linux
    steps:
        - checkout

        - run:
            <<: *check_skip

        # Fixed key (bump by hand): the datasets are several GB, so a miss is costly
        - restore_cache:
            keys:
              - data-cache-1

        # Also restore pip cache to speed up installations
        - restore_cache:
            keys:
              - pip-cache-0-{{ checksum "./pyproject.toml" }}
              - pip-cache-0-

        - run:
            name: Setup Python3 environment
            command: |
                python3 -m venv /home/circleci/mne_bids_env
                echo "source /home/circleci/mne_bids_env/bin/activate" >> $BASH_ENV

        - run:
            name: Pre-create MNE config
            command: mkdir -p /home/circleci/.mne

        - run:
            name: Install Python packages
            command: |
              python -m pip install --upgrade --progress-bar off pip
              python -m pip install --upgrade https://github.com/mne-tools/mne-python/archive/refs/heads/main.zip
              python -m pip install -e .[test,doc]

        - run:
            name: Download datasets shared by multiple examples
            # The gallery executes examples in parallel, so anything fetched by more
            # than one of them has to be on disk before the build starts.
            command: |
              python -c "import mne; mne.datasets.sample.data_path()"
              python -c "import mne; mne.datasets.testing.data_path()"
              python -c "import mne; mne.datasets.eegbci.load_data(subjects=[1, 2], runs=[2, 4, 8, 12], update_path=True)"

        - run:
            name: Build the documentation
            no_output_timeout: 30m
            command: |
              make build-doc 2>&1 | tee sphinx_log.txt

        - run:
            name: Check sphinx log for warnings (which are treated as errors)
            when: always
            command: |
              ! grep "^.*\(WARNING\|ERROR\): " sphinx_log.txt

        - persist_to_workspace:
            root: doc/_build
            paths: [html]

        - store_artifacts:
            path: doc/_build/html/
            destination: dev

        # Store the data cache (after the build: some examples fetch as they run)
        - save_cache:
            key: data-cache-1
            when: always
            paths:
              - ~/mne_data

        # Store pip cache
        - save_cache:
            key: pip-cache-0-{{ checksum "./pyproject.toml" }}
            when: always
            paths:
              - ~/.cache/pip

  docs-deploy:
    # runs on main (deployed to dev/) and maint/X.Y (deployed to X.Y/)
    docker:
      - image: cimg/python:3.13
    steps:
      - attach_workspace:
          at: /tmp/build

      - add_ssh_keys:
          fingerprints:
            - "13:a4:d4:26:26:fe:ea:a8:1a:f4:0b:0e:33:67:74:7d"

      - run:
          name: Deploy docs to gh-pages branch
          command: |
            set -eo pipefail
            python -m pip install "docstacks @ git+https://github.com/larsoner/docstacks@7b37f458f9c575cb665821eaa894101ceac487b1"
            git config --global user.email "circle@mne.com"
            git config --global user.name "Circle Ci"
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            git clone --branch gh-pages git@github.com:mne-tools/mne-bids.git ~/site
            cd ~/site
            if [ "${CIRCLE_BRANCH}" == "main" ]; then
              DIR=dev
            else
              DIR=${CIRCLE_BRANCH#maint/}
            fi
            if ! echo "${DIR}" | grep -qE '^([0-9]+\.[0-9]+|dev)$'; then
              echo "Refusing to deploy: branch ${CIRCLE_BRANCH} maps to invalid directory '${DIR}'."
              exit 1
            fi
            STABLE=$(readlink stable)
            CMD=deploy
            EXTRA=()
            if [ "${DIR}" == "dev" ]; then
              # label the dev entry with the release after stable, e.g. "0.20 (devel)"
              EXTRA=(--name "$(echo "${STABLE}" | awk -F. '{print $1"."$2+1}') (devel)")
            elif [ "$(printf '%s\n%s\n' "${STABLE}" "${DIR}" | sort -V | tail -n1)" != "${STABLE}" ]; then
              # first deploy of a release newer than stable: repoint stable and the switcher in one commit
              CMD=promote
            fi
            python -m docstacks ${CMD} /tmp/build/html "${DIR}" "${EXTRA[@]}" \
              --base-url https://mne.tools/mne-bids/ \
              --source-sha "${CIRCLE_SHA1}" \
              --message "CircleCI ${CMD} of ${DIR} docs (${CIRCLE_BUILD_NUM}) [skip ci]" \
              --push
            # squash history onto the previous squash commit every ~20 deploys
            python -m docstacks prune --keep 20 --min-squash 20 --push

  link-check:
    executor: linux
    steps:
      - checkout

      - attach_workspace:
          at: doc/_build

      - restore_cache:
          keys:
            - pip-cache-0-{{ checksum "./pyproject.toml" }}
            - pip-cache-0-

      - run:
          name: Setup Python3 environment
          command: |
              python3 -m venv /home/circleci/mne_bids_env
              echo "source /home/circleci/mne_bids_env/bin/activate" >> $BASH_ENV

      - run:
          name: Install Python packages
          command: |
            python -m pip install --upgrade --progress-bar off pip
            python -m pip install --upgrade https://github.com/mne-tools/mne-python/archive/refs/heads/main.zip
            python -m pip install -e .[test,doc]

      - run:
          name: Check links
          no_output_timeout: 30m
          command: |
            make -C doc linkcheck

workflows:
  commit:
    jobs:
      - docs-build
      - docs-deploy:
          requires:
            - docs-build
          filters:
            branches:
              only:
                - main
                - /maint\/.*/

  nightly:
    jobs:
      - docs-build

    triggers:
      - schedule:
          cron: "0 4 * * *"
          filters:
            branches:
              only:
                - main

  weekly:
    jobs:
      - docs-build
      - link-check:
          requires:
            - docs-build

    triggers:
      - schedule:
          cron: "0 4 * * 0"
          filters:
            branches:
              only:
                - main
