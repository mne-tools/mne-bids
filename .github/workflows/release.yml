# Upload a Python Package using Twine when a release is created

name: build
on:  # yamllint disable-line rule:truthy
  release:
    types: [published]
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: ${{ matrix.python-version }}
        activate-environment: true
        prune-cache: false
        save-cache: false  # just reuse one if available (and it should be)
        cache-dependency-glob: |
          ./pyproject.toml
    - run: uv pip install --upgrade pip build twine
    - run: python -m build --sdist --wheel
    - run: twine check --strict dist/*
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist
        include-hidden-files: true

  pypi-upload:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'release'
    permissions:
      id-token: write  # for trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/mne-bids
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: github.event_name == 'release'

  # Asks the conda-forge bot to open the version-bump PR on the feedstock right
  # away rather than waiting for its next scheduled scan
  conda-forge:
    needs: pypi-upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'release'
    permissions: {}
    env:
      GH_TOKEN: ${{ secrets.MNE_BOT_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - run: |
          gh issue create --repo conda-forge/mne-bids-feedstock \
            --title "@conda-forge-admin, please update version" \
            --body "mne-tools/mne-bids ${TAG} has been released and uploaded to PyPI."
